[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skanqrcode"
version = "0.1.0"
description = "Python SDK for the SkanQRCode URL/QR-code safety API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/skanqrcode"]
