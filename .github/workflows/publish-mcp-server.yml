# Publishes mcp/server to npm as @skanqrcode/mcp-server when a tag mcp-server-vX.Y.Z is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in this repo. Configure it once on
# npmjs.com (package settings -> Trusted publisher -> GitHub Actions, this repo, this workflow file).
name: Publish MCP server

on:
  push:
    tags: ["mcp-server-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    defaults:
      run:
        working-directory: mcp/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: |
          test "${GITHUB_REF_NAME#mcp-server-v}" = "$(node -p "require('./package.json').version")"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish
