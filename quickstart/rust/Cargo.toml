[package]
name = "skanqrcode-quickstart"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "skanqrcode-quickstart"
path = "main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
